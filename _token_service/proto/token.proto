// protoc --go_out=_token_service/pb --go_opt=paths=source_relative --go-grpc_out=_token_service/pb --go-grpc_opt=paths=source_relative _token_service/proto/token.proto


syntax = "proto3";
package proto;
 

option go_package =  "senpainikolay/go-internship-smartdata/auth-service/_token_service";


message ValidateTokenRequest { string token =1; }  

message ValidateTokenResponse { 
    uint64 usr_id =1;
} 

message GenerateTokenPairRequest{uint64 id=1;}

message GenerateTokenResponse { 
    string access_token =1;
    string refresh_token =2; 
} 


service TokenService {
    rpc ValidateAccessToken(ValidateTokenRequest) returns (ValidateTokenResponse) {}
    rpc ValidateRefreshToken(ValidateTokenRequest) returns (ValidateTokenResponse) {} 
    rpc GenerateTokenPair(GenerateTokenPairRequest) returns (GenerateTokenResponse) {}

  }
  



